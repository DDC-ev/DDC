<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDC File Menu Preview</title>
    
    <!-- External Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Unbounded:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    
    <!-- Tailwind for Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- GSAP for Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- New Component Styles -->
    <link rel="stylesheet" href="css/file-menu.css">
    
    <style>
        body {
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 100%);
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview-content {
            text-align: center;
            z-index: 1;
            max-width: 600px;
            padding: 2rem;
        }

        .btn-trigger {
            background: linear-gradient(135deg, #22d3ee, #06b6d4);
            padding: 1.25rem 2.5rem;
            border-radius: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-trigger:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 50px rgba(34, 211, 238, 0.6);
        }

        .bg-glow {
            position: absolute;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="preview-content">
        <h1 class="text-4xl md:text-6xl font-bold mb-6 font-unbounded">Responsive File System</h1>
        <p class="text-white/60 text-lg mb-10">Premium UI component with fluid scaling and ambient motion concepts.</p>
        
        <button class="btn-trigger" onclick="FileMenu.toggle(true)">
            Explore Files
        </button>
    </div>

    <!-- New Component Scripts -->
    <script src="js/file-menu.js"></script>

</body>
</html>
